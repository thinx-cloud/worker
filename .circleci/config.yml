version: 2.1

orbs:
  docker: circleci/docker@2.8.0
  ggshield: gitguardian/ggshield@1.1.4
  node: circleci/node@1.1.6
  sonarcloud: sonarsource/sonarcloud@1.0.3

jobs:

  test:
    docker:
      - image: thinxcloud/console-build-env:latest
    steps:
      - checkout
      - node/with-cache:
          steps:
            - run:
                name: Run Tests
                no_output_timeout: 1m
                command: |
                  npm install

workflows:

  build-and-publish:
    jobs:
      - test:
          context:
            - coveralls-worker
            - rollbar
            - sonarcloud

      - docker/publish:
          name: build and publish
          image: thinxcloud/worker
          tag: latest
          # Publish only from main. Without this the job runs on every branch,
          # so any feature-branch push overwrites the production :latest tag.
          filters:
            branches:
              only: main
          context:
            - dockerhub
            - rollbar
          # The Dockerfile's base image lives on dhi.io, which rejects anonymous
          # pulls. Its auth realm delegates to registry.docker.io, so the same
          # Docker Hub credentials the orb already uses authenticate there too.
          before_build:
            - run:
                name: Log in to dhi.io for the hardened base image
                command: |
                  echo "$DOCKER_PASSWORD" | docker login dhi.io -u "$DOCKER_LOGIN" --password-stdin
          requires:
            - test
